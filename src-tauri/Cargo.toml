[package]
name = "er-studio"
version = "0.1.0"
description = "ER Studio desktop"
edition = "2021"

[lib]
# The _lib suffix avoids a name clash with the binary on Windows.
name = "er_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Keep major.minor in step with the @tauri-apps npm packages; the CLI refuses mismatched versions.
tauri = { version = "~2.12", features = [] }
tauri-plugin-dialog = "~2.8"
tauri-plugin-fs = "~2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
