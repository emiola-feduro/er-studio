[package]
name = "er-db"
version = "0.1.0"
edition = "2021"
description = "Database connections for ER Studio desktop: transport chains (SSH, SOCKS, HTTP CONNECT), TLS and drivers"
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = "0.3.34"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
oracledb = "=26.0.0-beta.6"
mysql_async = { version = "0.37.1", default-features = false, features = ["minimal", "rustls-tls"] }
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
russh = { version = "0.65.2", default-features = false, features = ["flate2", "ring", "rsa"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-postgres = "0.7.18"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["logging", "tls12", "ring"] }
tokio-socks = "0.5.3"
tokio-util = { version = "0.7.20", features = ["compat"] }
webpki-roots = "1.0.12"
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[dev-dependencies]
rcgen = "0.14.10"
serde_json = "1.0.154"

# Windows authentication for SQL Server (SSPI) exists only on Windows.
[target.'cfg(windows)'.dependencies]
tiberius = { version = "0.13.0", default-features = false, features = ["tds73", "rustls", "chrono", "winauth"] }
