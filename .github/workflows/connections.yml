name: Connections

on:
  push:
    paths: ['src-tauri/**', '.github/workflows/connections.yml']
  pull_request:
    paths: ['src-tauri/**', '.github/workflows/connections.yml']
  workflow_dispatch:

concurrency:
  group: connections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The app embeds the built interface, so it has to exist before the Rust side compiles.
      - run: bun install --frozen-lockfile && bun run build

      # Compiler errors also go to the job annotations, which can be read without signing in.
      - name: Clippy
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --color never -- -D warnings 2>&1 | tee clippy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E '^(error|warning)' -A12 clippy.log | head -120 | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | sed 's/^/::error title=clippy::/'
          fi
          exit "$status"

      - name: Start test servers
        run: ERDB_MSSQL=1 CONTAINER_ENGINE=docker src-tauri/crates/er-db/tests/env/up.sh

      - name: Connection tests
        working-directory: src-tauri
        run: ERDB_TEST=1 ERDB_MSSQL=1 cargo test -p er-db

      - name: Stop test servers
        if: always()
        run: CONTAINER_ENGINE=docker src-tauri/crates/er-db/tests/env/down.sh
