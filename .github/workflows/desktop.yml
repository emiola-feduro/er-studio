name: Desktop release

on:
  push:
    tags: ['v*']
    # Feature and fix branches build too (the app embeds the interface, so any change counts).
    branches: ['feat/**', 'fix/**']
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces a build still running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: bun install --frozen-lockfile

      # A version tag gets its own draft release; any other build gets one named after its branch and commit, published when all installers are up.
      - name: Release name
        id: release
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
            echo "name=ER Studio $GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          else
            branch=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9.-' '-' | sed 's/-*$//')
            short=${GITHUB_SHA::7}
            echo "tag=build-$branch-$short" >>"$GITHUB_OUTPUT"
            echo "name=ER Studio $GITHUB_REF_NAME ($short)" >>"$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the update bundles; the app checks them with the public key in tauri.conf.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: bun tauri
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.name }}
          releaseBody: 'Desktop build of ER Studio for Windows, macOS and Linux. The installers are not signed yet.'
          releaseDraft: true
          prerelease: true
          # latest.json lists the signed bundles; installed apps read it from the latest published release.
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      # The macOS app is signed ad hoc (tauri.conf.json): without any signature, Gatekeeper calls a downloaded app
      # "damaged". This fails the build if the bundle is not signed as a whole.
      - name: Check the macOS signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          app=$(find src-tauri/target -path '*/bundle/macos/*.app' -maxdepth 5 -type d | head -1)
          echo "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature|Identifier|Format'

  # Branch builds become public prereleases once every installer is up; version tags stay drafts to publish by hand.
  publish:
    needs: build
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Publish as prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9.-' '-' | sed 's/-*$//')
          gh release edit "build-$branch-${GITHUB_SHA::7}" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
