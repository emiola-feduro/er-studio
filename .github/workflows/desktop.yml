name: Desktop release

on:
  push:
    tags: ['v*']
    # Feature branches that touch the desktop side build too, until the workflow lives on main.
    branches: ['feat/**']
    paths: ['src-tauri/**', '.github/workflows/desktop.yml']
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch replaces a build still running.
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: bun install --frozen-lockfile

      # A version tag publishes to its own release; any other build gets a draft named after its branch and commit.
      - name: Release name
        id: release
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "tag=$GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
            echo "name=ER Studio $GITHUB_REF_NAME" >>"$GITHUB_OUTPUT"
          else
            branch=$(echo "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9.-' '-' | sed 's/-*$//')
            short=${GITHUB_SHA::7}
            echo "tag=build-$branch-$short" >>"$GITHUB_OUTPUT"
            echo "name=ER Studio $GITHUB_REF_NAME ($short)" >>"$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: bun tauri
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: ${{ steps.release.outputs.name }}
          releaseBody: 'Desktop build of ER Studio for Windows, macOS and Linux. The installers are not signed yet.'
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
